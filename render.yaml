services:
  - type: web
    name: salesbrain-backend
    env: python
    buildCommand: |
      pip install -r backend/requirements.txt
      mkdir -p backend/app/data/uploads
      # Run Alembic migrations automatically on deploy
      alembic upgrade head
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./backend/app/data/salesbrain.db
        # To use PostgreSQL in production (Recommended), provision a Render PostgreSQL DB 
        # and override this environment variable in the Render Dashboard with the internal DB URL.
      - key: PORT
        value: 8000
      - key: AUTH_MODE
        value: firebase
      # - key: FIREBASE_SERVICE_ACCOUNT
      #   value: "Add your Firebase Admin JSON credential in the Render Dashboard"
    disk:
      name: salesbrain-data
      mountPath: /opt/render/project/src/backend/app/data
      sizeGB: 1
      
  - type: web
    name: salesbrain-frontend
    env: node
    buildCommand: |
      cd frontend
      npm install
      npm run build
    startCommand: |
      cd frontend
      npm start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: salesbrain-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_AUTH_MODE
        value: firebase
      # - key: NEXT_PUBLIC_FIREBASE_API_KEY
      #   value: "Add your Firebase config values in the Render Dashboard"
