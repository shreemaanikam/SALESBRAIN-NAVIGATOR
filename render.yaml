services:
  - type: web
    name: salesbrain-backend
    env: python
    plan: free
    buildCommand: |
      pip install -r backend/requirements.txt
      mkdir -p backend/app/data/uploads
      # Run Alembic migrations automatically on deploy
      alembic upgrade head
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./backend/app/data/salesbrain.db
      - key: ALLOW_EPHEMERAL_SQLITE
        value: "true"
      - key: PORT
        value: 8000
      - key: AUTH_MODE
        value: firebase
      - key: CORS_ORIGINS
        value: "https://salesbrain-frontend-c4q0.onrender.com,http://localhost:3000,http://127.0.0.1:3000" 
      # - key: FIREBASE_SERVICE_ACCOUNT
      #   value: "Add your Firebase Admin JSON credential in the Render Dashboard"
      
  - type: web
    name: salesbrain-frontend
    env: node
    plan: free
    buildCommand: |
      cd frontend
      npm install
      npm run build
    startCommand: |
      cd frontend
      npm start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: salesbrain-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_AUTH_MODE
        value: firebase
      # - key: NEXT_PUBLIC_FIREBASE_API_KEY
      #   value: "Add your Firebase config values in the Render Dashboard"
