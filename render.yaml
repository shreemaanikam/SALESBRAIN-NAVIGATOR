services:
  # Next.js Frontend
  - type: web
    name: salesbrain-frontend
    env: node
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm run start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: salesbrain-backend
          envVarKey: RENDER_EXTERNAL_URL

  # FastAPI Backend
  - type: web
    name: salesbrain-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt && PYTHONPATH=. python backend/app/ml/train.py"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATASET_PATH
        value: "dataset/Cleaned_SuperStore.csv"
      - key: ML_ARTIFACTS_DIR
        value: "backend/app/ml/artifacts"
      - key: CORS_ORIGINS
        value: "*"
