services:
  - type: web
    name: salesbrain-backend
    env: python
    buildCommand: |
      pip install -r backend/requirements.txt
      mkdir -p backend/app/data/uploads
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./backend/app/data/salesbrain.db
      - key: PORT
        value: 8000
    disk:
      name: salesbrain-data
      mountPath: /opt/render/project/src/backend/app/data
      sizeGB: 1
      
  - type: web
    name: salesbrain-frontend
    env: node
    buildCommand: |
      cd frontend
      npm install
      npm run build
    startCommand: |
      cd frontend
      npm start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: salesbrain-backend
          envVarKey: RENDER_EXTERNAL_URL
